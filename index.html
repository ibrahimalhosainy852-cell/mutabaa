<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>متابعة المعممين</title>
<meta name="theme-color" content="#5D4037">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متابعة المعممين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#5D4037; --primary-2:#8D6E63; --accent:#2E7D32;
    --bg:#f3efec; --card:#ffffff; --text:#2b2320; --muted:#7a6e69;
    --border:#ddd3ce; --danger:#c62828; --danger-bg:#fdecea; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
  [hidden]{display:none !important}
  .topbar{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:18px 16px 20px;text-align:center}
  .topbar h1{margin:0;font-size:21px;font-weight:800}
  .topbar p{margin:4px 0 0;font-size:14px;opacity:.9}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h2{margin:0 0 6px;font-size:16px;color:var(--primary)}
  .note{color:var(--danger);font-size:13px;margin:0 0 4px}
  label{display:block;font-weight:500;margin:12px 0 6px;font-size:15px}
  label:first-of-type{margin-top:0}
  .req{color:var(--danger)}
  input[type=text],input[type=date],select,textarea{
    width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--border);
    border-radius:10px;background:#fff;color:var(--text);min-height:48px}
  textarea{min-height:160px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(141,110,99,.18)}
  .invalid{border-color:var(--danger) !important;background:#fff8f8 !important}
  .hint{color:var(--muted);font-size:13px;margin-top:4px}
  .counter{text-align:left;color:var(--muted);font-size:12px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-light{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{flex:1}
  .error{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
  .center{text-align:center}
  .big-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto 12px;font-size:36px;background:#e6f4ea;color:var(--accent)}
  .review{width:100%;border-collapse:collapse}
  .review td{padding:9px 6px;border-bottom:1px solid #efe9e6;vertical-align:top;font-size:15px}
  .review td:first-child{color:var(--muted);width:36%}
  .review td:last-child{font-weight:500;white-space:pre-wrap;word-break:break-word}
  .spinner{width:56px;height:56px;border:6px solid #e8dfdb;border-top-color:var(--primary);border-radius:50%;margin:30px auto 16px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ref{font-size:30px;font-weight:800;color:var(--primary);margin:6px 0 14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>

<header class="topbar">
  <h1>متابعة عدم مشاركة المعمم</h1>
  <p>نموذج خاص بالإداري في كل محافظة لتوثيق مشاركة المشايخ وأسباب عدم المشاركة</p>
</header>

<main class="wrap">

  <section id="screen-loading">
    <div class="card center">
      <div class="spinner"></div>
      <p class="hint">جاري تحميل النموذج...</p>
      <div class="error" id="load-err" hidden></div>
      <button class="btn btn-primary" id="btn-retry" hidden onclick="loadOptions()">إعادة المحاولة</button>
    </div>
  </section>

  <section id="screen-form" hidden>
    <p class="note">* جميع الحقول مطلوبة</p>
    <div class="card">
      <label for="f-name">اسم المعمم <span class="req">*</span></label>
      <input type="text" id="f-name" maxlength="100" placeholder="اكتب الاسم الثلاثي">

      <label for="f-province">اسم المحافظة <span class="req">*</span></label>
      <select id="f-province"></select>

      <label for="f-date">تاريخ ملء الاستمارة <span class="req">*</span></label>
      <input type="date" id="f-date">

      <label for="f-reason">ذكر سبب عدم المشاركة <span class="req">*</span></label>
      <textarea id="f-reason" maxlength="5000" placeholder="اكتب سبب عدم المشاركة بالتفصيل" oninput="$('reason-count').textContent=this.value.length+' / 5000'"></textarea>
      <div class="counter" id="reason-count">0 / 5000</div>

      <div class="hp"><input type="text" id="f-website" tabindex="-1" autocomplete="off"></div>
    </div>
    <div class="error" id="form-err" hidden></div>
    <button class="btn btn-primary" onclick="goReview()">مراجعة قبل الإرسال</button>
  </section>

  <section id="screen-review" hidden>
    <div class="card">
      <h2>راجع المعلومات قبل الإرسال</h2>
      <table class="review" id="review-table"></table>
    </div>
    <div class="error" id="send-err" hidden></div>
    <div class="btn-row">
      <button class="btn btn-light" onclick="show('form')">تعديل</button>
      <button class="btn btn-accent" id="btn-send" onclick="send()">إرسال</button>
    </div>
  </section>

  <section id="screen-sending" hidden>
    <div class="card center">
      <div class="spinner"></div>
      <h2>جاري الإرسال...</h2>
    </div>
  </section>

  <section id="screen-success" hidden>
    <div class="card center">
      <div class="big-icon">✔</div>
      <h2>تم إرسال الاستمارة بنجاح</h2>
      <p class="hint" style="margin:0">رقم الاستمارة</p>
      <div class="ref" id="ref-id"></div>
      <button class="btn btn-primary" onclick="newRecord()">إدخال استمارة جديدة</button>
    </div>
  </section>

</main>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbxAhnF-8A5oSNUg26GNO9Ymx8nDwTGwwmp6PCNWHaznqYIi0nHt9Q5qtLNps6lN8KpWJQ/exec';
  var state = { data: null };

  function $(id) { return document.getElementById(id); }
  function show(name) {
    ['loading', 'form', 'review', 'sending', 'success'].forEach(function (s) {
      $('screen-' + s).hidden = (s !== name);
    });
    window.scrollTo(0, 0);
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setErr(id, msg) { $(id).textContent = msg || ''; $(id).hidden = !msg; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }

  function loadOptions() {
    setErr('load-err', ''); $('btn-retry').hidden = true;
    fetch(API + '?action=options&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        var p = $('f-province'); p.innerHTML = '';
        var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '— اختر المحافظة —'; p.appendChild(o0);
        res.options.provinces.forEach(function (v) { var x = document.createElement('option'); x.value = v; x.textContent = v; p.appendChild(x); });
        var pr = load('adm_province');
        if (pr && res.options.provinces.indexOf(pr) >= 0) p.value = pr;
        resetFields();
        show('form');
      })
      .catch(function () {
        setErr('load-err', navigator.onLine ? 'تعذّر تحميل النموذج، حاول مرة أخرى' : 'لا يوجد اتصال بالإنترنت');
        $('btn-retry').hidden = false;
      });
  }

  function resetFields() {
    $('f-name').value = '';
    $('f-date').value = today(); $('f-date').max = today();
    $('f-reason').value = ''; $('reason-count').textContent = '0 / 5000';
    $('f-website').value = '';
    setErr('form-err', ''); setErr('send-err', '');
    document.querySelectorAll('.invalid').forEach(function (e) { e.classList.remove('invalid'); });
  }

  function collect() {
    document.querySelectorAll('.invalid').forEach(function (e) { e.classList.remove('invalid'); });
    var bad = [];
    function mark(id) { $(id).classList.add('invalid'); bad.push(id); }
    var name = $('f-name').value.trim().replace(/\s+/g, ' '); if (name.length < 3) mark('f-name');
    var province = $('f-province').value; if (!province) mark('f-province');
    var date = $('f-date').value; if (!date || date > today()) mark('f-date');
    var reason = $('f-reason').value.trim(); if (reason.length < 3) mark('f-reason');
    if (bad.length) {
      setErr('form-err', 'يرجى إكمال الحقول المؤشرة باللون الأحمر');
      $(bad[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return null;
    }
    setErr('form-err', '');
    return { name: name, province: province, date: date, reason: reason, website: $('f-website').value };
  }

  function goReview() {
    var d = collect(); if (!d) return;
    state.data = d;
    var rows = [['اسم المعمم', d.name], ['المحافظة', d.province], ['تاريخ ملء الاستمارة', d.date], ['سبب عدم المشاركة', d.reason]];
    var t = $('review-table'); t.innerHTML = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.textContent = r[0];
      var b = document.createElement('td'); b.textContent = r[1];
      tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
    });
    setErr('send-err', '');
    show('review');
  }

  function send() {
    var d = state.data; if (!d) return;
    $('btn-send').disabled = true;
    show('sending');
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ data: d })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        $('btn-send').disabled = false;
        store('adm_province', d.province);
        $('ref-id').textContent = res.id;
        show('success');
      })
      .catch(function (e) {
        $('btn-send').disabled = false;
        var m = !navigator.onLine ? 'لا يوجد اتصال بالإنترنت'
              : (e && e.message && e.message !== 'Failed to fetch') ? e.message
              : 'تعذّر الاتصال، تأكد من الإنترنت وحاول مرة أخرى';
        setErr('send-err', 'لم يتم الإرسال: ' + m);
        show('review');
      });
  }
  function newRecord() { resetFields(); show('form'); }

  loadOptions();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
